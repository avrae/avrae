name: Lint PR

on:
  [ pull_request ]

permissions:
  contents: read
  id-token: write
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.10"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --frozen --group lint

      - name: Setup flake8 annotations
        uses: rbialon/flake8-annotations@v1

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          git diff -u origin/master HEAD | uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --diff
          # exit-zero treats all errors as warnings. We use a line length of 120
          git diff -u origin/master HEAD | uv run flake8 . --count --exit-zero --max-line-length=120 --statistics --diff

      - name: Ensure code is blackified
        run: |
          uv run black . --check --diff
