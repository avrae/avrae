[project]
name = "avrae"
version = "4.2.73"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    # avrae org deps
    "avrae-automation-common",
    "d20==1.1.2",
    "draconic-interpreter",

    # top-level dependencies
    "aiobotocore==2.12.4",
    "aiohttp==3.11",
    "boto3==1.34.106",
    "cachetools==5.3.3",
    "disnake~=2.10.1",
    "gspread~=6.1.1",
    "launchdarkly-server-sdk==9.0",
    "markdownify==0.14.1",
    "motor==3.4.0",
    "pillow~=10.3.0",
    "psutil==5.9.8",
    "pydantic==1.10.19",
    "pyjwt==2.4.0",
    "python-meteor==0.1.6",
    "pyyaml==6.0.1",
    "rapidfuzz~=3.6.1",
    "redis==5.0.4",

    # transitive
    "pymongo==4.7.2",

    # data logging
    "confluent-kafka==2.8.0",
    "ddtrace~=3.16.2",
]

# non-pypi dependencies
[tool.uv.sources]
draconic-interpreter = { git = "https://github.com/avrae/draconic", rev = "master" }
avrae-automation-common = { git = "https://github.com/avrae/automation-common", rev = "v4.2.0" }

[dependency-groups]
# dependencies for tests/
test = [
    "pytest==7.0.1",
    "pytest-asyncio==0.18.3",
    "pytest-cov==3.0.0"
]
# pre-commit and linting dependencies
lint = [
    "pre-commit==2.17.0",
    "ruff~=0.5.5",
    "flake8==5.0.4"
]
docs = [
    "Sphinx==5.3.0",
    "sphinx-rtd-theme==1.0.0"
]

# formatter config
[tool.ruff]
line-length = 120
preview = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
